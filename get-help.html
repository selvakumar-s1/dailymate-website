<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Help — DailyMate</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="index.html" class="logo">DailyMate</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="services.html" class="nav-link">Services</a></li>
                <li><a href="how-it-works.html" class="nav-link">How It Works</a></li>

                <li><a href="get-help.html" class="btn btn-primary">Get Help</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <h1 class="section-title">Tell DailyMate what you need</h1>
        <div class="card-form">
            <p style="text-align: center; margin-bottom: 2rem; color: #4B5563;">Your request will be sent securely to our assistant network. Please describe what you need below.</p>
            
            <!-- GOOGLE FORMS INTEGRATION PLACEHOLDER -->
            <div class="form-group">
                <label class="form-label">Describe what you need help with:</label>
                <textarea class="form-control" rows="5" placeholder="Example: I'm going away next weekend and need someone to look after my dog..."></textarea>
            </div>
            <div style="text-align: center; margin-top: 2rem;">
                <button class="btn btn-primary" onclick="alert('Form connection setup successfully!')">Submit Request</button>
            </div>
        </div>
    </main>
</body>
