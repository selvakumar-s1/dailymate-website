        <!-- PREMIUM BRANDED ANIMATION UI SYSTEM -->
    <style>
        .animate-nav-link {
            position: relative;
            transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .animate-nav-link::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #ff6b00;
            transform-origin: bottom right;
            transition: transform 0.25s ease-out;
        }
        .animate-nav-link:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
        .cta-hover-effect {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
        .cta-hover-effect:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 0, 0.4) !important;
            background: #e05e00 !important;
        }
    </style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="463b9ab1-f772-42ed-bf40-f2116ed38c95"></script>
